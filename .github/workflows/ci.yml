name: ci

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review on top of the defaults so CI runs when a draft flips to
    # ready; the skip-drafts condition on each job handles the rest.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-vet:
    name: build · vet
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The embedded clank-host is a gitignored build artifact; //go:embed
      # fails to compile without it on disk.
      - name: Build embedded clank-host
        run: make embed-host
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # TODO: add `go test -short ./...` once the pre-existing flaky tests on
      # main are fixed/quarantined (internal/tui, internal/cli/daemoncli,
      # internal/keepalive). Kept out for now so CI starts green.

  # Schema toolchain sync: sqlc-generated code must match schema.sql, and
  # the goose migrations must produce exactly the schema schema.sql
  # declares (Atlas replays migrations/ into an in-memory SQLite and
  # diffs). The store tests then cover the runtime side: goose adoption
  # of pre-goose databases and the migrated≡declared identity check.
  schema-sync:
    name: sqlc · migrations
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: migrations-lint diffs new migration files
          # against origin/main.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.30.0"
      - uses: ariga/setup-atlas@v0
      - name: sqlc code is regenerated and committed
        run: make generate && git diff --exit-code
      - name: migrations match schema.sql
        run: make migrations-check
      - name: lint new migrations for destructive changes
        run: make migrations-lint
      - name: Store tests
        run: go test ./internal/store/... ./internal/host/store/... ./internal/sqlmigrate/...

  # internal/agent isn't among the flaky packages above, so it runs here on its
  # own ahead of the repo-wide suite. -race is the point: the backend shutdown
  # regression tests guard a close-vs-send data race that's invisible without
  # the detector. opencode-dependent tests skip via exec.LookPath when the
  # binary is absent; the integration suite is behind //go:build integration.
  test-agent-race:
    name: race · internal/agent
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race tests (internal/agent)
        run: go test -race ./internal/agent/...
