# Publishes the Fly Machines host image (cmd/clank-host/Dockerfile.fly)
# to ghcr.io on every release tag. Downstream deployments consume the
# image BY DIGEST (printed in the job summary and resolvable via
# `docker buildx imagetools inspect`), so a tag is never silently
# repointed under a running fleet.
#
# Agent-CLI pins are extracted from internal/agent inside the build
# (see internal/agent/printpins) — there is no version input to this
# workflow and therefore nothing to drift.
name: publish-host-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build · push ghcr.io image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/acksell/clank-host-fly
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/clank-host/Dockerfile.fly
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print digest for deployments
        run: |
          echo "### clank-host-fly image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/acksell/clank-host-fly@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
