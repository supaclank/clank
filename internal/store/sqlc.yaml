version: "2"
# sqlc generates type-safe Go code for queries declared in queries/ against
# the declarative schema in schema.sql — the same file Atlas diffs against
# migrations/ to generate the goose migrations that actually run at Open()
# (see the `make migration` target).
#
# Regenerate with:  make generate   (or: sqlc generate -f internal/store/sqlc.yaml)
sql:
  - engine: "sqlite"
    queries: "queries"
    schema: "schema.sql"
    gen:
      go:
        package: "sqlitedb"
        out: "sqlitedb"
        sql_package: "database/sql"
        emit_interface: true
        emit_json_tags: false
        emit_prepared_queries: false
        emit_pointers_for_null_types: false
