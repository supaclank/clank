# Self-hosted clank example stack: minio (image-upload object storage)
# + clankd (gateway + local provisioner).
#
# Run:  docker compose -f docker/docker-compose.yml up -d --build
# Stop: docker compose -f docker/docker-compose.yml down
#
# One-time prereq: `make docker-setup` adds `127.0.0.1 clank-minio` to
# your /etc/hosts. Reason: clankd's image presigner mints SigV4-signed
# presigned S3 URLs whose Host header is part of the signature — laptop
# and containers must dial the *same* hostname for the signature to
# verify. Containers resolve `clank-minio` via Docker DNS; the laptop
# needs the /etc/hosts entry to do the same. See docker/README.md.

name: clank

services:
  # ── object storage ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    hostname: clank-minio
    networks:
      default:
        aliases: [clank-minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clankadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clankadmin}
    command: server /data --console-address :9001
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── one-shot bucket creation ────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://clank-minio:9000 ${MINIO_ROOT_USER:-clankadmin} ${MINIO_ROOT_PASSWORD:-clankadmin};
      mc mb local/${CLANK_IMAGES_BUCKET:-clank-images} || true
      "

  # ── dev auth stub (OAuth 2.0 + PKCE, auto-approves) ─────────────
  # Stand-in for a real OAuth 2.0 IdP so `clank login` works against
  # the local stack. Implements /authorize + /token per RFC 6749 +
  # RFC 7636; issues HS256-signed JWTs. Not for production.
  clank-auth-stub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: clank:latest
    command: ["clank-auth-stub"]
    environment:
      CLANK_AUTH_STUB_LISTEN: ":7879"
      CLANK_AUTH_STUB_PUBLIC_URL: "${CLANK_AUTH_STUB_PUBLIC_URL:-http://localhost:7879}"
      CLANK_AUTH_STUB_SECRET: "${CLANK_AUTH_STUB_SECRET:-dev-secret-change-me}"
      CLANK_AUTH_STUB_USER_ID: "${CLANK_AUTH_STUB_USER_ID:-dev-user}"
      CLANK_AUTH_STUB_EMAIL: "${CLANK_AUTH_STUB_EMAIL:-dev@clank.local}"
    ports:
      - "${CLANK_AUTH_STUB_PORT:-7879}:7879"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7879/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── gateway + local provisioner ──────────────────────────────────
  clankd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: clank:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - "clankd"
      - "start"
      - "--foreground"
      - "--listen=tcp://0.0.0.0:7878"
    environment:
      # HS256 mode: TCP listener accepts JWTs signed with this secret.
      # Wired to the auth-stub's secret so `clank login` against the
      # dev remote produces a token the gateway will verify.
      #
      # Auth modes are mutually exclusive — pick exactly one of:
      #   CLANK_AUTH_JWT_SECRET (HS256, dev/self-host)  ← used here
      #   CLANK_AUTH_OIDC_ISSUER + _AUDIENCE (production / SSO)
      #   CLANK_AUTH_TOKEN + CLANK_AUTH_ALLOW_STATIC=true (opt-in static)
      CLANK_AUTH_JWT_SECRET: "${CLANK_AUTH_STUB_SECRET:-dev-secret-change-me}"

      # OAuth 2.0 discovery — clankd serves these at GET /auth-config
      # pre-auth so `clank login` can bootstrap. Values point at the
      # auth-stub via the host port mapping (clankd doesn't call these;
      # it just echoes them to the laptop, which opens its browser
      # against them). The laptop reaches the stub at localhost:7879.
      CLANK_AUTH_AUTHORIZE_ENDPOINT: "${CLANK_AUTH_AUTHORIZE_ENDPOINT:-http://localhost:7879/authorize}"
      CLANK_AUTH_TOKEN_ENDPOINT: "${CLANK_AUTH_TOKEN_ENDPOINT:-http://localhost:7879/token}"
      CLANK_AUTH_CLIENT_ID: "${CLANK_AUTH_CLIENT_ID:-clank-cli}"
      CLANK_AUTH_SCOPES: "${CLANK_AUTH_SCOPES:-openid email}"

      # ── project-creation catalog ───────────────────────────────
      # Optional. JSON array of {display_name, clone_url} entries — the
      # builtin half of GET /v1/templates. Read by CLANK-HOST (the
      # local provisioner's subprocess inherits this env), not the
      # gateway: the host owns the template surface so self-hosted /
      # laptop deployments need no gateway involvement. Empty → only
      # the user's GitHub templates (if connected) appear. Set in
      # docker/.env (gitignored) — see docker/.env.example.
      CLANK_TEMPLATES: "${CLANK_TEMPLATES:-}"

      # GitHub Connect: clank-host (spawned by clankd via the local
      # provisioner) inherits this env var and reports available:true
      # on /credentials/github/status. Empty disables the feature
      # (status returns available:false; mobile hides the entry).
      # Defaults to the production OAuth App so the dev stack works
      # out of the box; override per-developer if you've registered
      # your own App for testing.
      CLANK_GITHUB_OAUTH_CLIENT_ID: "${CLANK_GITHUB_OAUTH_CLIENT_ID:-Ov23li78UDBwea5WvI5v}"

      # The local provisioner's single in-memory host record reports
      # this as its UserID. Must match the sub claim the auth-stub
      # mints (CLANK_AUTH_STUB_USER_ID) so the preview surface's
      # owner-only check passes — without this, every /v1/preview/
      # tokens/<token>/sign request 404s as cross-tenant.
      CLANK_LOCAL_USER_ID: "${CLANK_AUTH_STUB_USER_ID:-dev-user}"

      # Image-upload substrate. clankd's runGatewayServer reads these
      # in TCP mode via loadImagesFromEnv and mounts POST /v1/images
      # when CLANK_IMAGES_S3_BUCKET is set. The sprite downloads
      # uploaded images via the presigned GET URL (docker DNS
      # in-container, /etc/hosts on the laptop).
      CLANK_IMAGES_S3_BUCKET: "${CLANK_IMAGES_BUCKET:-clank-images}"
      CLANK_IMAGES_S3_REGION: "us-east-1"
      CLANK_IMAGES_S3_ENDPOINT: "http://clank-minio:9000"
      CLANK_IMAGES_S3_PUBLIC_ENDPOINT: "${CLANK_IMAGES_S3_PUBLIC_ENDPOINT:-}"
      CLANK_IMAGES_S3_ACCESS_KEY: "${MINIO_ROOT_USER:-clankadmin}"
      CLANK_IMAGES_S3_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-clankadmin}"
      CLANK_IMAGES_S3_PATH_STYLE: "true"
      CLANK_IMAGES_PRESIGN_TTL: "${CLANK_IMAGES_PRESIGN_TTL:-30m}"

      # ── preview-app surface ────────────────────────────────────
      # Optional. When set, clankd enables the tokenized-preview
      # routes — clank-host (spawned via the local provisioner)
      # registers its dev servers with the gateway, and requests to
      # preview-<token>.<root>/... get tunneled to the running
      # Metro process inside the container.
      #
      # For local browser testing, use "localhost" — `*.localhost`
      # resolves to 127.0.0.1 in every modern browser without
      # /etc/hosts edits. Example: `preview-abc.localhost:7878`
      # routes to clankd which tunnels to Metro on the same network.
      #
      # For mobile dev (real device or non-emulator): expose this
      # host via a tunnel (e.g. cloudflared) and set both the
      # tunnel hostname here AND CLANK_PREVIEW_WEBHOOK_URL below to
      # the tunnel URL.
      CLANK_PREVIEW_ROOT_DOMAIN: "${CLANK_PREVIEW_ROOT_DOMAIN:-}"

      # Optional. Hex-encoded 32+ byte HMAC secret for short-lived
      # signed preview URLs. Empty → gateway generates a random key
      # at startup; a restart invalidates outstanding signed URLs.
      # For shareable links that survive restarts, set this.
      CLANK_PREVIEW_SIGNING_KEY: "${CLANK_PREVIEW_SIGNING_KEY:-}"

      # Optional. URL the spawned clank-host POSTs its preview
      # register/revoke webhooks to. In the docker stack clank-host
      # runs as a subprocess of clankd in this same container, so
      # localhost is fine. When unset, the dev server still spawns
      # but no public token is minted (laptop dev without going
      # through the gateway integration).
      CLANK_PREVIEW_WEBHOOK_URL: "${CLANK_PREVIEW_WEBHOOK_URL:-http://localhost:7878/webhooks/preview}"
    ports:
      - "${CLANKD_PORT:-7878}:7878"
    volumes:
      - clankd-data:/root/.clank
      # Provide the prefs file with the bearer token + provisioner choice.
      - ./preferences.json:/root/.clank/preferences.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7878/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  minio-data:
  clankd-data:
